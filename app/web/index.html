<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EmasCare — a little company, close to home. Local Firebase demo.">
  <meta name="theme-color" content="#315d4b">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>EmasCare · Teman siang</title>
  <style>
    body { margin: 0; background: #f5f6f2; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; font: 16px/1.6 system-ui,sans-serif; color: #315d4b; text-align: center; }
    #loading strong { font-size: 30px; letter-spacing: -1px; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>EmasCare</strong><span>A little company, close to home.</span></div>
  <script src="preview_bridge.js"></script>
  <script src="voice_bridge.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script type="module">
    import {prepareLocalFirebase} from './firebase_local.mjs';
    try {
      await prepareLocalFirebase();
      const flutter = document.createElement('script');
      flutter.src = 'flutter_bootstrap.js';
      document.body.appendChild(flutter);
    } catch (error) {
      document.getElementById('loading').textContent = 'Local Firebase could not start. Open http://127.0.0.1:8090 and reload. The first launch needs internet access for the Firebase SDK.';
      console.error('Local Firebase initialization failed', error);
    }
  </script>
</body>
</html>
